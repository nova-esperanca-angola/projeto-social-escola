name: CI & Quality Gate - Projeto Social Escola

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: "Validação SDD & Testes Automatizados (Fases 1 a 7 + Issue #9)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, curl, zip
          coverage: none

      - name: Validar Fase 1 - Demanda & Schemas
        run: php scripts/validate-demanda-schema.php

      - name: Validar Fase 2 - Planejamento & Arquitetura
        run: php scripts/validate-fase-2-planejamento.php

      - name: Validar Fase 3 - Design Tokens & Componentes Stitch
        run: php scripts/validate-fase-3-design.php

      - name: Validar Fase 4 - Conteúdo, Salvaguarda Infantil & Dados
        run: php scripts/validate-fase-4-conteudo-dados.php

      - name: Validar Fase 5 - Aplicação PHP & Templates Modulares
        run: php scripts/validate-fase-5-desenvolvimento.php

      - name: Validar Fase 6 - Testes Anti-Spam, Acessibilidade WCAG AA & TTFB
        run: php scripts/validate-fase-6-testes-qa.php

      - name: Validar Fase 7 - Roteamento Hostinger, Headers de Segurança & Backups
        run: php scripts/validate-fase-7-deploy-lancamento.php

      - name: "Validar Issue #9 - Desktop Shell, Header Completo & Rodapé Institucional"
        run: php scripts/validate-issue-9-desktop-shell.php

      - name: "Sucesso no Quality Gate"
        run: |
          echo "Todos os critérios das Fases 1 a 7 e da Issue #9 do WDLC foram aprovados com 100% de sucesso!"

  deploy:
    name: Deploy em Produção (Hostinger)
    runs-on: ubuntu-latest
    needs: [validate-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH na Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST || '185.211.7.156' }}
          SSH_USER: ${{ secrets.HOSTINGER_USER || 'u451023057' }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::Secret HOSTINGER_SSH_KEY não configurado no repositório. Para auto-deploy via GitHub Actions, cadastre em Settings > Secrets and variables > Actions."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash /home/$SSH_USER/scripts/deploy_projeto_social_escola.sh"
